databases:
  - name: monument-db
    databaseName: monument_db
    user: monument_user
    plan: free

services:
  # 1. Redis Cache & Queue
  - type: keyvalue
    name: monument-redis
    plan: free
    ipAllowList: []

  # 2. FastAPI Web Service
  - type: web
    name: monument-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monument-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: monument-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # 3. Background Processing Worker
  - type: worker
    name: monument-worker
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "celery -A backend.worker.celery_app worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monument-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: monument-redis
          property: connectionString

  # 4. React Frontend
  - type: web
    name: monument-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        sync: false  # Allows manual entry in dashboard or runtime fallback